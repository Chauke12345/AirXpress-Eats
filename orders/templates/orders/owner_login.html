<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>AirXpress Eats Management Login</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, sans-serif;
            background: #f4f4f4;

            display: flex;
            align-items: center;
            justify-content: center;

            padding: 20px;
        }

        .login-card {
            width: 100%;
            max-width: 420px;
            background: #ffffff;
            padding: 32px;
            border-radius: 14px;

            box-shadow:
                0 8px 30px rgba(0, 0, 0, 0.10);
        }

        .login-brand {
            text-align: center;
            margin-bottom: 28px;
        }

        .login-icon {
            width: 64px;
            height: 64px;
            margin: 0 auto 14px;

            display: flex;
            align-items: center;
            justify-content: center;

            border-radius: 50%;
            background: #222222;

            font-size: 30px;
        }

        .login-brand h1 {
            margin: 0;
            font-size: 25px;
            color: #222222;
        }

        .login-brand p {
            margin: 8px 0 0;
            color: #777777;
            line-height: 1.5;
        }

        .management-label {
            display: inline-block;
            margin-top: 12px;
            padding: 5px 10px;

            background: #eeeeee;
            color: #555555;

            border-radius: 20px;

            font-size: 12px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        .form-group label {
            display: block;
            margin-bottom: 7px;
            font-weight: 700;
            color: #333333;
        }

        .form-group input {
            width: 100%;
            padding: 13px;

            border: 1px solid #cccccc;
            border-radius: 8px;

            font-size: 16px;
        }

        .form-group input:focus {
            outline: none;
            border-color: #222222;
        }

        .login-btn {
            width: 100%;
            padding: 14px;

            border: none;
            border-radius: 8px;

            background: #222222;
            color: #ffffff;

            font-size: 17px;
            font-weight: 700;

            cursor: pointer;
        }

        .login-btn:hover {
            background: #444444;
        }

        .error-message {
            background: #fde8e6;
            color: #a82b22;

            padding: 12px;
            border-radius: 8px;
            margin-bottom: 18px;

            font-size: 14px;
        }

        .back-link {
            margin-top: 20px;
            text-align: center;
        }

        .back-link a {
            color: #666666;
            text-decoration: none;
            font-size: 14px;
        }

        .back-link a:hover {
            text-decoration: underline;
        }

    </style>

</head>


<body>

<div class="login-card">

    <div class="login-brand">

        <div class="login-icon">
            ðŸ 
        </div>

        <h1>
            AirXpress Eats Management
        </h1>

        <p>
            Sign in to monitor connected businesses,
            subscriptions and platform activity.
        </p>

        <span class="management-label">
            Management Portal
        </span>

    </div>


    {% if messages %}

        {% for message in messages %}

            <div class="error-message">
                {{ message }}
            </div>

        {% endfor %}

    {% endif %}


    <form method="POST">

        {% csrf_token %}

        <div class="form-group">

            <label for="id_username">
                Username
            </label>

            <input
                type="text"
                name="username"
                id="id_username"
                required
                autocomplete="username"
            >

        </div>


        <div class="form-group">

            <label for="id_password">
                Password
            </label>

            <input
                type="password"
                name="password"
                id="id_password"
                required
                autocomplete="current-password"
            >

        </div>


        <button
            type="submit"
            class="login-btn"
        >
            Management Login
        </button>

    </form>

</div>

</body>

</html>
