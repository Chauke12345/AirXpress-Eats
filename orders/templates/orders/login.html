<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AirXpress Eats | Login</title>
    <style>
        * { box-sizing: border-box; }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, sans-serif;
            background: #f4f4f4;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .login-card {
            width: 100%;
            max-width: 430px;
            background: #fff;
            padding: 35px;
            border-radius: 16px;
            box-shadow: 0 8px 30px rgba(0,0,0,.08);
        }

        .brand {
            text-align: center;
            margin-bottom: 28px;
        }

        .brand h1 {
            margin: 0;
            font-size: 28px;
        }

        .brand p {
            margin: 8px 0 0;
            color: #777;
        }

        .login-option {
            display: block;
            text-decoration: none;
            color: #222;
            background: #f7f7f7;
            border: 1px solid #ddd;
            border-radius: 10px;
            padding: 15px 18px;
            margin-bottom: 12px;
            font-weight: 700;
            transition: .2s;
        }

        .login-option:hover {
            background: #eee;
            transform: translateY(-1px);
        }

        .back {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: #777;
            text-decoration: none;
            font-size: 14px;
        }

        .back:hover {
            color: #222;
        }
    </style>
</head>

<body>
    <div class="login-card">
        <div class="brand">
            <h1>AirXpress Eats</h1>
            <p>Choose how you want to sign in</p>
        </div>

        <a href="{% url 'customer_login' %}" class="login-option">
            Customer Login
        </a>

        <a href="{% url 'driver_login' %}" class="login-option">
            Driver Login
        </a>

        <a href="{% url 'staff_login' %}" class="login-option">
            Staff Login
        </a>

        <a href="{% url 'owner_login' %}" class="login-option">
            Management Login
        </a>

        <a href="{% url 'home' %}" class="back">
            &larr; Back to AirXpress Eats
        </a>
    </div>
</body>
</html>
