<!DOCTYPE html>
<html lang="en">
<head>
        {% load static %}
<meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AirXpress Eats | Login</title>
    <style>
        * { box-sizing: border-box; }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, sans-serif;
            background: #101010;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .login-card {
            width: 100%;
            max-width: 430px;
            background: #1b1b1b;
            padding: 35px;
            border-radius: 16px;
            box-shadow: 0 15px 45px rgba(0,0,0,.35); border: 1px solid #303030;
        }

        .brand {
            text-align: center;
            margin-bottom: 28px;
        }

        .brand-logo {
            display: block;
            width: 150px;
            max-width: 100%;
            max-height: 125px;
            height: auto;
            object-fit: contain;
            margin: 0 auto 14px;
            filter: drop-shadow(0 4px 12px rgba(255, 255, 255, 0.08));
        }
        .brand h1 {
            margin: 0;
            font-size: 28px;
        }

        .brand p {
            margin: 8px 0 0;
            color: #bdbdbd;
        }

        .login-option {
            display: block;
            text-decoration: none;
            color: #f5f5f5;
            background: #242424;
            border: 1px solid #3a3a3a;
            border-radius: 10px;
            padding: 15px 18px;
            margin-bottom: 12px;
            font-weight: 700;
            transition: .2s;
        }

        .login-option:hover {
            background: #303030;
            transform: translateY(-1px);
        }

        .back {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: #bdbdbd;
            text-decoration: none;
            font-size: 14px;
        }

        .back:hover {
            color: #f5f5f5;
        }
    </style>
</head>

<body>
    <div class="login-card">
        <div class="brand">
            <img class="brand-logo"
     src="{% static 'orders/images/Airxpress-logo.png' %}"
     alt="AirXpress Eats logo">
            <h1>AirXpress Eats</h1>
            <p>Choose how you want to sign in</p>
        </div>

        <a href="{% url 'customer_login' %}" class="login-option">
            Customer Login
        </a>

        <a href="{% url 'driver_login' %}" class="login-option">
            Driver Login
        </a>

        <a href="{% url 'staff_login' %}" class="login-option">
            Staff Login
        </a>

        <a href="{% url 'owner_login' %}" class="login-option">
            Management Login
        </a>

        <a href="{% url 'home' %}" class="back">
            &larr; Back to AirXpress Eats
        </a>
    </div>
</body>
</html>
