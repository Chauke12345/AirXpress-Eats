<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Check Your Email | AirXpress Eats</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f7f6;
            color: #222;
        }

        .wrapper {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 30px 15px;
        }

        .card {
            width: 100%;
            max-width: 500px;
            background: white;
            padding: 40px;
            border-radius: 18px;
            box-shadow: 0 10px 35px rgba(0,0,0,0.10);
            text-align: center;
        }

        .logo img {
            max-width: 180px;
            max-height: 80px;
            object-fit: contain;
            margin-bottom: 25px;
        }

        h1 {
            margin-bottom: 15px;
        }

        p {
            color: #666;
            line-height: 1.6;
        }

        .back {
            display: inline-block;
            margin-top: 25px;
            padding: 13px 22px;
            background: #198754;
            color: white;
            border-radius: 9px;
            text-decoration: none;
            font-weight: bold;
        }
    </style>
</head>

<body>

<div class="wrapper">

    <div class="card">

        <div class="logo">
            <img src="/static/orders/images/Airxpress-main-logo.png"
                 alt="AirXpress Eats">
        </div>

        <h1>Check Your Email</h1>

        <p>
            If an AirXpress Eats account exists with that email address,
            we have sent instructions to reset your password.
        </p>

        <p>
            Please check your inbox and your spam or junk folder.
        </p>

        <a href="{% url 'customer_login' %}" class="back">
            BACK TO LOGIN
        </a>

    </div>

</div>

</body>
</html>
