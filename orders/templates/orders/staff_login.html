{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>AirXpress Eats | Staff Login</title>

    <style>
        :root {
            --black: #050505;
            --dark: #0b0b0b;
            --dark2: #141414;
            --silver: #bdbdbd;
            --light: #eeeeee;
            --white: #ffffff;
            --muted: #8d8d8d;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;

            font-family:
                Arial,
                Helvetica,
                sans-serif;

            background:
                radial-gradient(
                    circle at top,
                    #202020 0%,
                    var(--black) 48%,
                    #000000 100%
                );

            color: var(--white);

            display: flex;
            align-items: center;
            justify-content: center;

            padding: 24px;
        }

        .login-wrapper {
            width: 100%;
            max-width: 460px;
        }

        .login-card {
            width: 100%;

            background:
                linear-gradient(
                    145deg,
                    #151515,
                    #090909
                );

            border: 1px solid rgba(255,255,255,0.12);

            border-radius: 22px;

            padding: 42px 38px;

            box-shadow:
                0 25px 70px rgba(0,0,0,0.55),
                inset 0 1px 0 rgba(255,255,255,0.06);
        }

        .login-brand {
            text-align: center;
            margin-bottom: 34px;
        }

        .logo-wrap {
            width: 92px;
            height: 92px;

            margin: 0 auto 20px;

            display: flex;
            align-items: center;
            justify-content: center;

            background: #ffffff;

            border-radius: 50%;

            padding: 10px;

            box-shadow:
                0 10px 30px rgba(0,0,0,0.45);
        }

        .logo-wrap img {
            width: 100%;
            height: 100%;

            object-fit: contain;

            display: block;
        }

        .login-brand h1 {
            margin: 0;

            font-size: 28px;
            line-height: 1.2;

            font-weight: 800;

            letter-spacing: -0.5px;

            color: var(--white);
        }

        .login-brand p {
            margin: 9px 0 0;

            color: var(--silver);

            font-size: 14px;
        }

        .brand-line {
            width: 55px;
            height: 3px;

            margin: 18px auto 0;

            background: var(--silver);

            border-radius: 10px;
        }

        .error-message {
            background: rgba(255,255,255,0.08);

            border: 1px solid rgba(255,255,255,0.18);

            color: var(--white);

            padding: 13px 14px;

            border-radius: 10px;

            margin-bottom: 20px;

            font-size: 14px;

            text-align: center;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;

            margin-bottom: 8px;

            color: var(--light);

            font-size: 14px;

            font-weight: 700;
        }

        .form-group input {
            width: 100%;

            padding: 15px 16px;

            background: #101010;

            border: 1px solid rgba(255,255,255,0.18);

            border-radius: 10px;

            color: var(--white);

            font-size: 16px;

            outline: none;

            transition: 0.2s ease;
        }

        .form-group input::placeholder {
            color: #666666;
        }

        .form-group input:focus {
            border-color: var(--silver);

            background: #151515;

            box-shadow:
                0 0 0 3px rgba(189,189,189,0.10);
        }

        .login-btn {
            width: 100%;

            padding: 15px 18px;

            border: 1px solid rgba(255,255,255,0.25);

            border-radius: 10px;

            background: var(--white);

            color: var(--black);

            font-size: 16px;

            font-weight: 800;

            cursor: pointer;

            transition:
                background 0.2s ease,
                color 0.2s ease,
                transform 0.2s ease;
        }

        .login-btn:hover {
            background: var(--silver);

            transform: translateY(-1px);
        }

        .login-btn:active {
            transform: translateY(0);
        }

        .back-link {
            margin-top: 24px;

            text-align: center;
        }

        .back-link a {
            color: var(--silver);

            text-decoration: none;

            font-size: 13px;

            transition: 0.2s ease;
        }

        .back-link a:hover {
            color: var(--white);
        }

        .footer-text {
            margin-top: 25px;

            text-align: center;

            color: #666666;

            font-size: 11px;

            letter-spacing: 0.5px;
        }

        @media (max-width: 520px) {

            body {
                padding: 16px;
            }

            .login-card {
                padding: 32px 22px;

                border-radius: 18px;
            }

            .logo-wrap {
                width: 78px;
                height: 78px;
            }

            .login-brand h1 {
                font-size: 23px;
            }
        }
    </style>
</head>

<body>

<div class="login-wrapper">

    <div class="login-card">

        <div class="login-brand">

            <div class="logo-wrap">
                <img
                    src="{% static 'orders/images/Airxpress-logo.png' %}"
                    alt="AirXpress Eats"
                >
            </div>

            <h1>
                AirXpress Eats
            </h1>

            <p>
                Staff Login
            </p>

            <div class="brand-line"></div>

        </div>


        {% if messages %}

            {% for message in messages %}

                <div class="error-message">
                    {{ message }}
                </div>

            {% endfor %}

        {% endif %}


        <form method="POST">

            {% csrf_token %}

            <div class="form-group">

                <label for="id_username">
                    Username
                </label>

                <input
                    type="text"
                    name="username"
                    id="id_username"
                    autocomplete="username"
                    placeholder="Enter your username"
                    required
                >

            </div>


            <div class="form-group">

                <label for="id_password">
                    Password
                </label>

                <input
                    type="password"
                    name="password"
                    id="id_password"
                    autocomplete="current-password"
                    placeholder="Enter your password"
                    required
                >

            </div>


            <button
                type="submit"
                class="login-btn"
            >
                Staff Login
            </button>

        </form>


        <div class="back-link">

            <a href="{% url 'airxpress_help' %}">
                Need Help? Contact AirXpress Support
            </a>

            <div style="margin-top:14px;">
                <a href="{% url 'home' %}">
                    ← Back to AirXpress Eats
                </a>
            </div>

        </div>

    </div>


    <div class="footer-text">
        AIRXPRESS EATS • STAFF PORTAL
    </div>

</div>

</body>
</html>
