<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password | AirXpress Eats</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f7f6;
            color: #222;
        }

        .wrapper {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 30px 15px;
        }

        .card {
            width: 100%;
            max-width: 450px;
            background: white;
            padding: 35px;
            border-radius: 18px;
            box-shadow: 0 10px 35px rgba(0,0,0,0.10);
        }

        .logo {
            text-align: center;
            margin-bottom: 25px;
        }

        .logo img {
            max-width: 180px;
            max-height: 80px;
            object-fit: contain;
        }

        h1 {
            text-align: center;
            margin-bottom: 10px;
        }

        .description {
            text-align: center;
            color: #777;
            line-height: 1.5;
            margin-bottom: 25px;
        }

        label {
            display: block;
            font-weight: bold;
            margin-bottom: 7px;
        }

        input {
            width: 100%;
            padding: 13px;
            border: 1px solid #ddd;
            border-radius: 9px;
            font-size: 15px;
            margin-bottom: 18px;
        }

        input:focus {
            outline: none;
            border-color: #198754;
        }

        button {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 9px;
            background: #198754;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #146c43;
        }

        .back {
            text-align: center;
            margin-top: 22px;
        }

        .back a {
            color: #198754;
            font-weight: bold;
            text-decoration: none;
        }
    </style>
</head>

<body>

<div class="wrapper">

    <div class="card">

        <div class="logo">
            <img src="/static/orders/images/Airxpress-main-logo.png"
                 alt="AirXpress Eats">
        </div>

        <h1>Forgot Password?</h1>

        <p class="description">
            Enter the email address associated with your AirXpress Eats
            account and we'll send you instructions to reset your password.
        </p>

        <form method="post">
            {% csrf_token %}

            {{ form.email.errors }}

            <label for="id_email">Email Address</label>

            <input
                type="email"
                id="id_email"
                name="email"
                placeholder="Enter your email address"
                autocomplete="email"
                required
            >

            <button type="submit">
                SEND RESET EMAIL
            </button>
        </form>

        <div class="back">
            <a href="{% url 'customer_login' %}">
                Back to Login
            </a>
        </div>

    </div>

</div>

</body>
</html>
