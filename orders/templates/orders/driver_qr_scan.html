<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Verify Delivery QR | AirXpress Eats</title>
<style>
body{margin:0;padding:20px;background:#111;color:#fff;font-family:Arial,sans-serif}
main{max-width:560px;margin:24px auto;padding:22px;background:#1d1d1d;border:1px solid #444;border-radius:16px}
button,input{box-sizing:border-box;width:100%;padding:13px;margin-top:10px;border-radius:8px;font-size:16px}
button{border:0;background:#36a852;color:white;font-weight:bold;cursor:pointer}
input{background:white;color:#111}
#reader{margin:18px 0}
a{color:#9bd4ff}
</style>
</head>
<body>
<main>
<h1>Verify Customer Delivery QR</h1>
<p>Order #{{ order.id }}</p>
<p>Scan the customer's code at handover.</p>
<div id="reader"></div>
<button type="button" id="start">Start Camera Scanner</button>
<form id="verify" method="post" action="{% url 'driver_verify_delivery_qr' order.id %}">
{% csrf_token %}
<label for="token">QR token (manual fallback)</label>
<input id="token" name="token" required autocomplete="off" placeholder="Scan or enter QR token">
<button type="submit">Verify QR and Complete Delivery</button>
</form>
<p id="result" role="status" aria-live="polite"></p>
<p><a href="{% url 'driver_dashboard' %}">Return to dashboard</a></p>
</main>
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<script>
(() => {
 const form=document.getElementById("verify"), input=document.getElementById("token");
 const result=document.getElementById("result"), start=document.getElementById("start");
 let busy=false, scanner=null;
 async function submitToken(token) {
  if(busy)return;
  busy=true; input.value=token.trim(); result.textContent="Verifying with server?";
  if(scanner){try{await scanner.stop();await scanner.clear()}catch(e){} scanner=null}
  try{
   const response=await fetch(form.action,{method:"POST",body:new FormData(form),credentials:"same-origin"});
   const data=await response.json(); result.textContent=data.message||"Verification failed.";
   if(response.ok&&data.success){window.location.assign(data.redirect_url);return}
  }catch(e){result.textContent="Connection failed. Please try again."}
  busy=false;
 }
 form.addEventListener("submit",e=>{e.preventDefault();submitToken(input.value)});
 start.addEventListener("click",async()=>{
  if(!window.Html5Qrcode){result.textContent="Camera library unavailable. Use the token field or check internet access.";return}
  try{
   scanner=new Html5Qrcode("reader");
   await scanner.start({facingMode:"environment"},{fps:10,qrbox:240},
    text=>submitToken(text),()=>{});
   result.textContent="Camera active. Point it at the customer QR.";
  }catch(e){scanner=null;result.textContent="Allow camera access and use HTTPS, or enter the token manually."}
 });
})();
</script>
</body>
</html>
