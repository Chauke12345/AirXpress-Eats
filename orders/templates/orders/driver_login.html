<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>AirXpress Driver Login</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            background: #111111;
            color: #ffffff;
            font-family: Arial, sans-serif;
        }

        .login-card {
            width: 100%;
            max-width: 420px;
            padding: 32px;
            background: #1b1b1b;
            border: 1px solid #333333;
            border-radius: 18px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.35);
        }

        .brand {
            text-align: center;
            margin-bottom: 28px;
        }

        .brand h1 {
            margin: 0;
            font-size: 30px;
        }

        .brand p {
            margin: 8px 0 0;
            color: #aaaaaa;
            font-size: 14px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-size: 14px;
            font-weight: 700;
        }

        input {
            width: 100%;
            padding: 14px;
            border: 1px solid #444444;
            border-radius: 10px;
            background: #111111;
            color: #ffffff;
            font-size: 16px;
            outline: none;
        }

        input:focus {
            border-color: #ffffff;
        }

        button {
            width: 100%;
            padding: 14px;
            border: 0;
            border-radius: 10px;
            background: #ffffff;
            color: #111111;
            font-size: 16px;
            font-weight: 800;
            cursor: pointer;
        }

        button:hover {
            opacity: 0.9;
        }

        .messages {
            margin-bottom: 18px;
        }

        .message {
            padding: 12px;
            border-radius: 10px;
            background: #2a2a2a;
            color: #ffffff;
            font-size: 14px;
        }
    </style>
</head>

<body>

    <div class="login-card">

        <div class="brand">
            <h1>AirXpress</h1>
            <p>Driver Portal</p>
        </div>

        {% if messages %}
            <div class="messages">
                {% for message in messages %}
                    <div class="message">
                        {{ message }}
                    </div>
                {% endfor %}
            </div>
        {% endif %}

        <form method="POST">

            {% csrf_token %}

            <div class="form-group">
                <label for="username">
                    Username
                </label>

                <input
                    type="text"
                    id="username"
                    name="username"
                    autocomplete="username"
                    required
                >
            </div>

            <div class="form-group">
                <label for="password">
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    name="password"
                    autocomplete="current-password"
                    required
                >
            </div>

            <button type="submit">
                Driver Login
            </button>

        </form>        <a href="{% url 'airxpress_help' %}" style="display:block;margin-top:18px;text-align:center;color:#fff;text-decoration:none;font-size:14px;font-weight:700;">Need Help? Contact AirXpress Support</a>
<a href="{% url 'home' %}" style="display:block;margin-top:15px;text-align:center;color:#aaa;text-decoration:none;font-size:14px;">&larr; Back to AirXpress Eats</a>

    </div>

</body>
</html>
