<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Thank You | AirXpress Eats</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: Arial, Helvetica, sans-serif;
            background: linear-gradient(135deg, #050505, #181818);
            color: white;
        }

        .card {
            width: 90%;
            max-width: 600px;
            text-align: center;
            padding: 50px 30px;
            border-radius: 25px;
            background: rgba(255,255,255,0.07);
            border: 1px solid rgba(255,255,255,0.12);
        }

        .icon {
            font-size: 70px;
            margin-bottom: 20px;
        }

        h1 {
            font-size: 34px;
            margin-bottom: 15px;
        }

        p {
            color: #aaa;
            font-size: 17px;
            line-height: 1.6;
        }

        .button {
            display: inline-block;
            margin-top: 25px;
            padding: 14px 28px;
            border-radius: 30px;
            background: white;
            color: black;
            text-decoration: none;
            font-weight: bold;
        }
    </style>
</head>

<body>

<div class="card">

    <div class="icon">⭐</div>

    <h1>Thank You!</h1>

    <p>
        Thank you for reviewing your AirXpress Eats order.
        Your feedback helps us improve the experience for everyone.
    </p>

    <a href="{% url 'customer_my_orders' %}" class="button">
        Back to My Orders
    </a>

</div>

</body>
</html>
